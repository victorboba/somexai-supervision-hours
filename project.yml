name: SupervisionHours
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  SupervisionHours:
    type: application
    platform: iOS
    sources:
      - path: SupervisionHours
      - path: Shared
    dependencies:
      - target: SupervisionHoursWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.supervision-hours
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SupervisionHours/SupervisionHours.entitlements
    info:
      path: SupervisionHours/Info.plist
      properties:
        CFBundleDisplayName: Supervision Hours
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  SupervisionHoursWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SupervisionHoursWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.supervision-hours.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SupervisionHoursWidget/SupervisionHoursWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: SupervisionHoursWidget/Info.plist
      properties:
        CFBundleDisplayName: Supervision Hours Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SupervisionHoursTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SupervisionHoursTests
    dependencies:
      - target: SupervisionHours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.supervision-hours.tests
        GENERATE_INFOPLIST_FILE: YES
  SupervisionHoursUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SupervisionHoursUITests
    dependencies:
      - target: SupervisionHours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.supervision-hours.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SupervisionHours
schemes:
  SupervisionHours:
    build:
      targets:
        SupervisionHours: all
        SupervisionHoursTests: [test]
        SupervisionHoursUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: SupervisionHours/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: SupervisionHours/StoreKit/Products.storekit
      targets:
        - SupervisionHoursTests
        - SupervisionHoursUITests
    archive:
      config: Release
